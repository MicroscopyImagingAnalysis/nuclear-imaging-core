name: Static validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python sources
        run: python -m compileall -q src tests
      - name: Validate notebook documents
        run: python -c "import ast,json,pathlib; [ast.parse(''.join(c.get('source', []))) for p in pathlib.Path('examples').glob('*.ipynb') for c in json.loads(p.read_text())['cells'] if c['cell_type'] == 'code']"
